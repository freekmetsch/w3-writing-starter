<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:,">
  <title>Writing 3 · C2 Part 2 practice</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #202b34;
      --muted: #4c5b66;
      --paper: #ffffff;
      --wash: #f7f8f8;
      --line: #b9c4ca;
      --blue: #2b526d;
      --blue-dark: #1d3c52;
      --blue-pale: #eaf0f3;
      --rust: #a8442d;
      --rust-pale: #f7ece7;
      font-family: "Segoe UI", Arial, sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      margin: 0;
      background: var(--wash);
      color: var(--ink);
      font-size: 1rem;
      line-height: 1.55;
    }

    button, summary { font: inherit; }

    button {
      min-height: 48px;
      border: 2px solid transparent;
      border-radius: 4px;
      cursor: pointer;
    }

    button:focus-visible,
    summary:focus-visible {
      outline: 3px solid var(--rust);
      outline-offset: 3px;
    }

    button:disabled { cursor: not-allowed; opacity: 0.65; }

    .page {
      width: min(100% - 2rem, 880px);
      margin: 0 auto;
      padding: clamp(1rem, 4vw, 2.5rem) 0 2rem;
    }

    .masthead {
      padding-bottom: 1rem;
      border-bottom: 2px solid var(--blue);
    }

    .eyebrow {
      margin: 0 0 0.25rem;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 700;
    }

    h1, h2, h3, p { margin-top: 0; }

    h1 {
      margin-bottom: 0.25rem;
      font-size: clamp(1.7rem, 5vw, 2.4rem);
      line-height: 1.15;
    }

    .masthead p:last-child { margin-bottom: 0; }

    .stage {
      margin-top: 1rem;
      padding: clamp(1rem, 4vw, 1.5rem);
      border: 1px solid var(--line);
      background: var(--paper);
    }

    .stage h2 {
      margin-bottom: 0.75rem;
      font-size: clamp(1.3rem, 4vw, 1.7rem);
      line-height: 1.2;
    }

    .primary {
      display: inline-flex;
      width: 100%;
      align-items: center;
      justify-content: center;
      padding: 0.7rem 1rem;
      background: var(--blue-dark);
      color: var(--paper);
      font-size: 1.05rem;
      font-weight: 700;
      text-align: center;
    }

    .primary:hover { background: var(--blue); }

    .secondary {
      padding: 0.45rem 0.75rem;
      border-color: var(--blue);
      background: var(--paper);
      color: var(--blue-dark);
      font-weight: 600;
    }

    .secondary:hover { background: var(--blue-pale); }

    .prompt-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.75rem;
      margin: 1rem 0;
    }

    .prompt-choice {
      display: block;
      width: 100%;
      min-height: 100%;
      padding: 1rem;
      border-color: var(--line);
      background: var(--paper);
      color: var(--ink);
      text-align: left;
    }

    .prompt-choice:hover {
      border-color: var(--blue);
      background: var(--blue-pale);
    }

    .prompt-choice strong {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--blue-dark);
      font-size: 1rem;
      line-height: 1.35;
    }

    .prompt-choice span { display: block; }

    .writing-layout {
      display: grid;
      grid-template-columns: minmax(140px, 0.45fr) minmax(0, 1.55fr);
      gap: 1rem;
      align-items: start;
    }

    .timer-card {
      padding: 1rem;
      border: 1px solid var(--line);
      background: var(--paper);
    }

    .timer-card .eyebrow { color: var(--muted); }

    .timer-value {
      display: block;
      margin: 0.2rem 0 0;
      color: var(--blue-dark);
      font-size: clamp(2.2rem, 7vw, 3rem);
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      line-height: 1;
    }

    .timer-message {
      margin: 0.75rem 0 0;
      padding: 0.65rem;
      border-left: 4px solid var(--rust);
      background: var(--rust-pale);
    }

    .writing-prompt { margin-bottom: 1rem; }

    details {
      margin: 1rem 0;
      border: 1px solid var(--line);
      background: var(--paper);
    }

    summary {
      min-height: 48px;
      padding: 0.65rem 0.75rem;
      color: var(--blue-dark);
      cursor: pointer;
      font-weight: 700;
    }

    .language-content { padding: 0 0.75rem 0.75rem; }
    .language-content p { margin-bottom: 0.6rem; color: var(--muted); }
    .language-list { display: grid; gap: 0.55rem; margin: 0; padding: 0; list-style: none; }

    .language-list li {
      padding: 0.55rem 0.65rem;
      background: var(--blue-pale);
    }

    .language-list strong { color: var(--blue-dark); }
    .word-kind { color: var(--muted); font-size: 0.88rem; }

    .writing-actions { display: flex; flex-wrap: wrap; gap: 0.75rem; }
    .fine-print { margin: 0.75rem 0 0; color: var(--muted); font-size: 0.9rem; }
    [hidden] { display: none !important; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 640px) {
      .page { width: min(100% - 1.25rem, 880px); padding-top: 0.65rem; }
      .prompt-grid, .writing-layout { grid-template-columns: 1fr; }
      .timer-card {
        display: grid;
        grid-template-columns: auto 1fr;
        align-items: center;
        gap: 0.25rem 1rem;
      }
      .timer-card .eyebrow, .timer-value { margin: 0; }
      .timer-message { grid-column: 1 / -1; }
      .writing-actions > button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="masthead">
      <h1>Writing 3</h1>
      <p>C2 Proficiency Part 2-style practice · 15-minute start</p>
    </header>

    <section class="stage" id="welcome" aria-labelledby="welcome-title">
      <h2 class="sr-only" id="welcome-title">Start practice</h2>
      <button class="primary" id="start-practice" type="button">Start practice</button>
      <p class="fine-print">Write on paper or in your document. Nothing is saved here.</p>
    </section>

    <section class="stage" id="prompt-stage" aria-labelledby="prompt-stage-title" hidden>
      <h2 id="prompt-stage-title" tabindex="-1">Choose a task</h2>
      <div class="prompt-grid" id="prompt-options"></div>
      <button class="secondary" id="new-pair" type="button">Another pair</button>
    </section>

    <section class="stage" id="writing-stage" aria-labelledby="writing-title" hidden>
      <div class="writing-layout">
        <aside class="timer-card" aria-label="Writing timer">
          <p class="eyebrow">Time remaining</p>
          <time class="timer-value" id="timer-value" role="timer" aria-live="off">15:00</time>
          <p class="timer-message" id="timer-message" role="status" aria-live="polite" hidden></p>
        </aside>

        <div>
          <h2 id="writing-title" tabindex="-1"></h2>
          <p class="writing-prompt" id="writing-prompt"></p>

          <details id="language-details">
            <summary>Optional words and phrases</summary>
            <div class="language-content">
              <p>Use one or two if they fit.</p>
              <ul class="language-list" id="language-list"></ul>
            </div>
          </details>

          <div class="writing-actions">
            <button class="secondary" id="choose-another" type="button">Choose another task</button>
          </div>
        </div>
      </div>
    </section>

    <noscript><p class="stage timer-message">Turn on JavaScript to choose a task and run the timer.</p></noscript>
  </main>

  <script>
    "use strict";

    const prompts = [
      {
        id: "study-spaces",
        format: "Article",
        prompt: "The student magazine is preparing an issue on places to study between classes. As a student who uses these spaces, write an article for fellow students to help them choose where to work. Describe one place, explain what helps or hinders study there, and suggest one improvement.",
        language: [
          { term: "communal", kind: "adjective", meaning: "shared by a group" },
          { term: "amenity", kind: "noun", meaning: "a useful feature of a place" },
          { term: "conducive to", kind: "phrase", meaning: "helping something happen" },
          { term: "distraction", kind: "noun", meaning: "something that takes your attention away" },
          { term: "make better use of", kind: "phrase", meaning: "use more effectively" }
        ]
      },
      {
        id: "skills-outside-class",
        format: "Article",
        prompt: "A student magazine is collecting articles on skills learned outside class. As a student with experience of one such activity, write an article for fellow students about its value. Describe the activity, explain one skill it develops, and show how that skill could help after graduation.",
        language: [
          { term: "extracurricular", kind: "adjective", meaning: "outside formal lessons" },
          { term: "transferable skill", kind: "noun phrase", meaning: "a skill useful in different settings" },
          { term: "initiative", kind: "noun", meaning: "the ability to act without being told" },
          { term: "perseverance", kind: "noun", meaning: "continued effort despite difficulty" },
          { term: "apply", kind: "verb", meaning: "use in a particular situation" }
        ]
      },
      {
        id: "weekend-activity",
        format: "Article",
        prompt: "A local magazine is preparing a guide to low-cost weekend activities. As a student who knows the area, write an article for local readers recommending one activity. Explain why it is worth trying and suggest how more people could take part.",
        language: [
          { term: "affordable", kind: "adjective", meaning: "low enough in price for people to pay" },
          { term: "appeal", kind: "noun", meaning: "the quality that makes something attractive" },
          { term: "accessible", kind: "adjective", meaning: "easy for people to use or join" },
          { term: "low-cost", kind: "adjective", meaning: "needing little money" },
          { term: "broaden participation", kind: "phrase", meaning: "help more people take part" }
        ]
      },
      {
        id: "student-events",
        format: "Report",
        prompt: "The students' union is planning its programme for next term. As a course representative, write a report for union officers to help them choose events. Assess which current activities students value, identify one group whose needs are not met, and recommend an event.",
        language: [
          { term: "turnout", kind: "noun", meaning: "the number of people who attend an event" },
          { term: "participation", kind: "noun", meaning: "the act of taking part in an activity" },
          { term: "inclusive", kind: "adjective", meaning: "designed to involve different people" },
          { term: "cater for", kind: "phrase", meaning: "provide what a person or group needs" },
          { term: "appeal to", kind: "phrase", meaning: "be attractive or interesting to" }
        ]
      },
      {
        id: "cycle-parking",
        format: "Report",
        prompt: "The university board is reviewing cycle parking on campus. As a student who cycles to campus, write a report for board members to help them decide what to change. Assess current provision, explain who is affected by its limits, and recommend one improvement.",
        language: [
          { term: "provision", kind: "noun", meaning: "something supplied or made available" },
          { term: "secure", kind: "adjective", meaning: "safe from theft or harm" },
          { term: "sheltered", kind: "adjective", meaning: "protected from weather" },
          { term: "commuter", kind: "noun", meaning: "someone who travels regularly to work or study" },
          { term: "allocate funds", kind: "phrase", meaning: "set money aside for a purpose" }
        ]
      },
      {
        id: "welcome-activities",
        format: "Report",
        prompt: "The programme committee wants to improve welcome activities for new students. As a first-year mentor, write a report for committee members to guide next year's programme. Evaluate which activities help students settle in, identify a gap, and recommend two changes.",
        language: [
          { term: "orientation", kind: "noun", meaning: "an introduction to a new place or programme" },
          { term: "belonging", kind: "noun", meaning: "the feeling of being accepted in a group" },
          { term: "signpost", kind: "verb", meaning: "show someone where to find help or information" },
          { term: "transition", kind: "noun", meaning: "a change from one situation to another" },
          { term: "retain", kind: "verb", meaning: "continue to have or keep" }
        ]
      },
      {
        id: "film-setting",
        format: "Review",
        prompt: "An online magazine invites reviews of documentaries that change how viewers see everyday objects. As someone who watched one, write a review for readers choosing a documentary. Explain its subject, assess how well the film holds attention, and say who would enjoy it.",
        language: [
          { term: "setting", kind: "noun", meaning: "the place and time in which a story happens" },
          { term: "portrayal", kind: "noun", meaning: "the way a person or place is shown" },
          { term: "convincing", kind: "adjective", meaning: "believable" },
          { term: "nuanced", kind: "adjective", meaning: "showing careful differences or details" },
          { term: "resonate with", kind: "phrase", meaning: "create a feeling of connection with" }
        ]
      },
      {
        id: "arts-event",
        format: "Review",
        prompt: "A local arts magazine invites reviews of events that may interest students. As someone who attended an exhibition or performance, write a review for student readers to help them decide whether to go. Describe a memorable feature and assess the event.",
        language: [
          { term: "immersive", kind: "adjective", meaning: "making the audience feel involved" },
          { term: "pace", kind: "noun", meaning: "the speed or flow of an event" },
          { term: "compelling", kind: "adjective", meaning: "holding your attention" },
          { term: "interpretation", kind: "noun", meaning: "the way an artist presents an idea" },
          { term: "accessible to", kind: "phrase", meaning: "easy for someone to understand or experience" }
        ]
      },
      {
        id: "explainer-book",
        format: "Review",
        prompt: "A student magazine is reviewing non-fiction books that explain a subject to general readers. As a reader of one such book, write a review for fellow students choosing a book to read. Explain the subject, assess how clearly the author presents it, and say who would find it useful.",
        language: [
          { term: "non-specialist", kind: "noun", meaning: "someone without expert knowledge" },
          { term: "well-researched", kind: "adjective", meaning: "based on careful investigation" },
          { term: "engaging", kind: "adjective", meaning: "interesting and able to hold attention" },
          { term: "oversimplify", kind: "verb", meaning: "make something seem simpler than it is" },
          { term: "clarity", kind: "noun", meaning: "the quality of being easy to understand" }
        ]
      },
      {
        id: "cafe-food-waste",
        format: "Formal letter",
        prompt: "The local newspaper invites readers to suggest how cafés in town could reduce food waste. As a regular customer, write a formal letter to the editor for local readers. Describe one source of waste, propose a practical change, and explain its likely effect.",
        language: [
          { term: "surplus", kind: "noun", meaning: "more of something than is needed" },
          { term: "dispose of", kind: "phrase", meaning: "throw something away" },
          { term: "perishable", kind: "adjective", meaning: "likely to go bad quickly" },
          { term: "portion", kind: "noun", meaning: "an amount of food served to one person" },
          { term: "reduce waste", kind: "phrase", meaning: "use or throw away less" }
        ]
      },
      {
        id: "outdoor-space",
        format: "Formal letter",
        prompt: "A community centre is asking regular visitors how to improve its outdoor space. As a visitor, write a formal letter to the centre director recommending a change. Describe how the space is used now, suggest one improvement, and explain who would benefit.",
        language: [
          { term: "versatile", kind: "adjective", meaning: "useful for many different purposes" },
          { term: "communal", kind: "adjective", meaning: "shared by a group" },
          { term: "sheltered", kind: "adjective", meaning: "protected from weather" },
          { term: "maintenance", kind: "noun", meaning: "work needed to keep something in good condition" },
          { term: "accommodate", kind: "verb", meaning: "provide enough space for" }
        ]
      },
      {
        id: "arts-attendance",
        format: "Formal letter",
        prompt: "The local arts council wants to attract more students to its events. As a regular attendee, write a formal letter to council members suggesting how to do this. Identify one reason students may not attend, propose an initiative, and explain how it could reach them.",
        language: [
          { term: "attendance", kind: "noun", meaning: "the number of people who go to an event" },
          { term: "barrier", kind: "noun", meaning: "something that prevents people from taking part" },
          { term: "initiative", kind: "noun", meaning: "a planned action to improve a situation" },
          { term: "target audience", kind: "noun phrase", meaning: "the group an event or message is meant for" },
          { term: "widen the appeal", kind: "phrase", meaning: "make something attractive to more people" }
        ]
      }
    ];
    prompts.push(
      {
        id: "article-repair-cafes",
        format: "Article",
        prompt: "A community magazine is preparing an issue on repair cafés. As a volunteer at one, write an article for local residents to encourage them to try it. Explain how the café works, describe one benefit, and suggest an item people could bring.",
        language: [
          { term: "repairable", kind: "adjective", meaning: "possible to fix when damaged" },
          { term: "durable", kind: "adjective", meaning: "able to last through regular use" },
          { term: "restore", kind: "verb", meaning: "return something to good condition" },
          { term: "take apart", kind: "phrase", meaning: "separate something into its parts" },
          { term: "extend the life of", kind: "phrase", meaning: "keep something useful for longer" }
        ]
      },
      {
        id: "article-language-exchange",
        format: "Article",
        prompt: "The university magazine is collecting articles on language-exchange groups. As a student who has attended one, write an article for fellow students about what they offer. Describe how a session works, explain what participants learn, and suggest how a new member could join.",
        language: [
          { term: "exchange", kind: "noun", meaning: "an activity where people share something with each other" },
          { term: "fluency", kind: "noun", meaning: "the ability to speak smoothly and easily" },
          { term: "informal", kind: "adjective", meaning: "relaxed and not highly structured" },
          { term: "conversation partner", kind: "noun phrase", meaning: "someone you practise speaking with" },
          { term: "break the ice", kind: "phrase", meaning: "make people feel more comfortable when they first meet" }
        ]
      },
      {
        id: "article-rest-places",
        format: "Article",
        prompt: "A city newsletter invites articles about places to pause during a busy day. As someone who uses one, write an article for local residents introducing it as a useful option. Describe what it offers, explain who benefits, and suggest how it could welcome more people.",
        language: [
          { term: "respite", kind: "noun", meaning: "a short period of rest or relief" },
          { term: "amenity", kind: "noun", meaning: "a useful feature of a place" },
          { term: "tranquil", kind: "adjective", meaning: "quiet and peaceful" },
          { term: "accessible", kind: "adjective", meaning: "easy for people to enter and use" },
          { term: "make space for", kind: "phrase", meaning: "leave room to include someone or something" }
        ]
      },
      {
        id: "article-online-tutorials",
        format: "Article",
        prompt: "The student magazine is exploring learning through online tutorials. As a student who has used one, write an article for fellow students about its value. Describe a useful tutorial, assess its limits, and explain how to use it well.",
        language: [
          { term: "tutorial", kind: "noun", meaning: "a lesson that explains how to do something" },
          { term: "self-paced", kind: "adjective", meaning: "done at a speed chosen by the learner" },
          { term: "assess", kind: "verb", meaning: "judge the value or quality of something" },
          { term: "reliable source", kind: "noun phrase", meaning: "a source that gives trustworthy information" },
          { term: "retain information", kind: "phrase", meaning: "remember what you have learned" }
        ]
      },
      {
        id: "article-responsible-visits",
        format: "Article",
        prompt: "A travel magazine is preparing a guide to responsible visits to nearby towns. As a visitor who knows one town, write an article for travellers. Describe one attraction, explain how visitors can respect local life, and suggest how they can support the community.",
        language: [
          { term: "responsible tourism", kind: "noun phrase", meaning: "travel that respects local people and places" },
          { term: "custom", kind: "noun", meaning: "a usual way of behaving in a place or group" },
          { term: "considerate", kind: "adjective", meaning: "careful not to upset or inconvenience others" },
          { term: "local economy", kind: "noun phrase", meaning: "business and work in a particular area" },
          { term: "minimise the impact", kind: "phrase", meaning: "make a negative effect as small as possible" }
        ]
      },
      {
        id: "article-local-markets",
        format: "Article",
        prompt: "A community newsletter is planning an issue on local markets. As someone who visits one, write an article for residents about its value. Describe what people can find there, explain how it serves the area, and suggest how more residents could benefit.",
        language: [
          { term: "stall", kind: "noun", meaning: "a small place where goods are sold" },
          { term: "produce", kind: "noun", meaning: "food grown or made for sale" },
          { term: "seasonal", kind: "adjective", meaning: "available or suitable at a particular time of year" },
          { term: "source locally", kind: "phrase", meaning: "buy goods from nearby producers" },
          { term: "livelihood", kind: "noun", meaning: "work that provides a person with money to live" }
        ]
      },
      {
        id: "article-skill-sharing",
        format: "Article",
        prompt: "The student magazine invites articles about people sharing skills across generations. As someone who has taken part, write an article for students. Describe the activity, explain what each group gains, and suggest how others could join.",
        language: [
          { term: "intergenerational", kind: "adjective", meaning: "involving people of different age groups" },
          { term: "reciprocal", kind: "adjective", meaning: "given and received by each side" },
          { term: "mentor", kind: "noun", meaning: "someone who gives advice and support" },
          { term: "perspective", kind: "noun", meaning: "a way of seeing or understanding something" },
          { term: "pass on a skill", kind: "phrase", meaning: "teach a skill to another person" }
        ]
      },
      {
        id: "article-small-museums",
        format: "Article",
        prompt: "A local arts magazine is preparing a guide to small museums. As a visitor to one, write an article for people planning a day out. Describe one feature, explain what makes it worth visiting, and say who is likely to enjoy it.",
        language: [
          { term: "exhibit", kind: "noun", meaning: "an object or group of objects shown to visitors" },
          { term: "artefact", kind: "noun", meaning: "an object made or used by people in the past" },
          { term: "curator", kind: "noun", meaning: "a person who selects and cares for museum objects" },
          { term: "interpretation", kind: "noun", meaning: "an explanation of what something means" },
          { term: "well-preserved", kind: "adjective", meaning: "kept in good condition" }
        ]
      },
      {
        id: "article-group-projects",
        format: "Article",
        prompt: "The university magazine asks students how to make group projects work well. As a student who has completed one, write an article for new students. Describe one challenge, explain how your group handled it, and suggest a useful approach.",
        language: [
          { term: "delegate", kind: "verb", meaning: "give different tasks to different people" },
          { term: "coordinate", kind: "verb", meaning: "organise people or activities so they work well together" },
          { term: "contribution", kind: "noun", meaning: "something a person adds to a shared task" },
          { term: "consensus", kind: "noun", meaning: "general agreement within a group" },
          { term: "stay on track", kind: "phrase", meaning: "continue to make progress towards a goal" }
        ]
      },
      {
        id: "article-neighbourhood-gardens",
        format: "Article",
        prompt: "A community magazine is looking at neighbourhood gardens. As a volunteer in one, write an article for local residents. Describe how people use the garden, explain what it adds to the neighbourhood, and suggest how new volunteers can help.",
        language: [
          { term: "cultivate", kind: "verb", meaning: "prepare land and grow plants" },
          { term: "yield", kind: "noun", meaning: "the amount of crops produced" },
          { term: "biodiversity", kind: "noun", meaning: "the variety of plants and animals in an area" },
          { term: "plot", kind: "noun", meaning: "a small area of land used for growing plants" },
          { term: "tend to", kind: "phrase", meaning: "look after something regularly" }
        ]
      },
      {
        id: "article-reading-groups",
        format: "Article",
        prompt: "A university magazine invites articles about reading groups. As a member of one, write an article for fellow students. Explain how the group chooses what to read, describe one benefit of discussion, and suggest how new members can join.",
        language: [

          { term: "representative", kind: "adjective", meaning: "including a fair range of people or views" },
          { term: "submit feedback", kind: "phrase", meaning: "send comments for someone to consider" }
        ]
      },
      {
        id: "letter-screens-in-waiting-areas",
        format: "Formal letter",
        prompt: "A local newspaper invites letters about screens in public-service waiting areas. As a regular visitor, write a formal letter to the editor for readers. Describe one benefit or problem, propose a guideline, and explain how it may affect visitors.",
        language: [
          { term: "notification", kind: "noun", meaning: "a message that gives new information" },
          { term: "privacy", kind: "noun", meaning: "the right to keep personal matters private" },
          { term: "discreet", kind: "adjective", meaning: "not easy to notice or hear" },
          { term: "queue", kind: "noun", meaning: "a line of people waiting" },
          { term: "accommodate", kind: "verb", meaning: "provide enough space or suitable conditions for" }
        ]
      },
      {
        id: "letter-arts-workshop-building",
        format: "Formal letter",
        prompt: "The town council is considering turning a vacant warehouse into a shared arts workshop. As a local resident, write a formal letter to the planning officer. Explain a possible use, identify one concern, and recommend a condition for the plan.",
        language: [
          { term: "repurpose", kind: "verb", meaning: "use something for a different purpose" },
          { term: "heritage", kind: "noun", meaning: "features of the past that a community values" },
          { term: "feasibility", kind: "noun", meaning: "how possible it is to do something" },
          { term: "shared workspace", kind: "noun phrase", meaning: "a place used by different people for work" },
          { term: "preserve the character", kind: "phrase", meaning: "keep the features that make a place distinctive" }
        ]
      },
      {
        id: "letter-late-night-deliveries",
        format: "Formal letter",
        prompt: "The local newspaper is publishing views on late-night deliveries in residential streets. As a resident, write a formal letter to the editor for local readers. Describe how deliveries affect the area, propose a practical change, and explain its likely effect.",
        language: [
          { term: "delivery window", kind: "noun phrase", meaning: "the set hours when goods may be delivered" },
          { term: "nuisance", kind: "noun", meaning: "something that causes difficulty or annoyance" },
          { term: "residential", kind: "adjective", meaning: "used mainly for people to live in" },
          { term: "mitigate", kind: "verb", meaning: "make a problem or harm less serious" },
          { term: "enforce", kind: "verb", meaning: "make sure a rule is obeyed" }
        ]
      },
      {
        id: "letter-waste-sorting-guidance",
        format: "Formal letter",
        prompt: "The council is revising its instructions for sorting household waste. As a resident, write a formal letter to the environmental-services director. Describe one confusing instruction, suggest a clearer version, and explain how this could reduce sorting errors.",
        language: [
          { term: "recyclable", kind: "adjective", meaning: "able to be used again after processing" },
          { term: "contamination", kind: "noun", meaning: "unwanted material mixed with something being recycled" },
          { term: "disposal", kind: "noun", meaning: "the act of getting rid of something" },
          { term: "sorting guide", kind: "noun phrase", meaning: "instructions for putting items into the right groups" },
          { term: "clearly labelled", kind: "adjective", meaning: "marked with words that are easy to understand" }
        ]
      },
      {
        id: "letter-nature-reserve-paths",
        format: "Formal letter",
        prompt: "A nature reserve is reviewing paths during the nesting season. As a regular walker, write a formal letter to the reserve manager. Describe one concern, suggest how visitors could be guided, and explain how your proposal could protect wildlife while keeping paths open.",
        language: [
          { term: "nesting", kind: "adjective", meaning: "relating to birds making or using a nest" },
          { term: "habitat", kind: "noun", meaning: "the natural place where a plant or animal lives" },
          { term: "seasonal", kind: "adjective", meaning: "happening at a particular time of year" },
          { term: "disturbance", kind: "noun", meaning: "an action that interrupts or upsets something" },
          { term: "marked route", kind: "noun phrase", meaning: "a path shown with signs or symbols" }
        ]
      }
    );
    const welcome = document.querySelector("#welcome");
    const promptStage = document.querySelector("#prompt-stage");
    const writingStage = document.querySelector("#writing-stage");
    const promptOptions = document.querySelector("#prompt-options");
    const timerValue = document.querySelector("#timer-value");
    const timerMessage = document.querySelector("#timer-message");
    const languageDetails = document.querySelector("#language-details");
    const languageList = document.querySelector("#language-list");

    let currentPair = [];
    let lastPairIds = [];
    let timerDeadline = 0;
    let timerInterval = null;

    function shuffle(items) {
      const result = [...items];
      for (let index = result.length - 1; index > 0; index -= 1) {
        const other = Math.floor(Math.random() * (index + 1));
        [result[index], result[other]] = [result[other], result[index]];
      }
      return result;
    }

    function makePair() {
      const available = prompts.filter((item) => !lastPairIds.includes(item.id));
      const pool = available.length >= 2 ? available : prompts;
      const ordered = shuffle(pool);
      const first = ordered[0];
      const second = ordered.find((item) => item.format !== first.format);
      currentPair = [first, second];
      lastPairIds = currentPair.map((item) => item.id);
      renderPair();
    }

    function setView(view) {
      welcome.hidden = view !== "welcome";
      promptStage.hidden = view !== "prompts";
      writingStage.hidden = view !== "writing";
    }

    function renderPair() {
      promptOptions.replaceChildren();
      currentPair.forEach((item) => {
        const button = document.createElement("button");
        const title = document.createElement("strong");
        const text = document.createElement("span");
        button.type = "button";
        button.className = "prompt-choice";
        title.textContent = `${item.format} · 280–320 words`;
        text.textContent = item.prompt;
        button.append(title, text);
        button.addEventListener("click", () => choosePrompt(item));
        promptOptions.append(button);
      });
    }

    function renderLanguage(items) {
      languageList.replaceChildren();
      items.forEach((item) => {
        const row = document.createElement("li");
        const heading = document.createElement("strong");
        const kind = document.createElement("span");
        const meaning = document.createElement("span");
        heading.textContent = item.term;
        kind.className = "word-kind";
        kind.textContent = ` (${item.kind})`;
        meaning.textContent = ` — ${item.meaning}`;
        row.append(heading, kind, meaning);
        languageList.append(row);
      });
    }

    function choosePrompt(item) {
      stopTimer();
      document.querySelector("#writing-title").textContent = `${item.format} · 280–320 words`;
      document.querySelector("#writing-prompt").textContent = item.prompt;
      renderLanguage(item.language);
      languageDetails.open = false;
      timerMessage.hidden = true;
      timerMessage.textContent = "";
      timerValue.textContent = "15:00";
      setView("writing");
      document.querySelector("#writing-title").focus();
      startTimer();
    }

    function startTimer() {
      timerDeadline = Date.now() + 15 * 60 * 1000;
      updateTimer();
      timerInterval = window.setInterval(updateTimer, 1000);
    }

    function stopTimer() {
      if (timerInterval !== null) {
        window.clearInterval(timerInterval);
        timerInterval = null;
      }
      timerDeadline = 0;
    }

    function updateTimer() {
      if (timerDeadline === 0) return;
      const remaining = Math.max(0, Math.ceil((timerDeadline - Date.now()) / 1000));
      const minutes = Math.floor(remaining / 60);
      const seconds = remaining % 60;
      timerValue.textContent = `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;

      if (remaining === 0) {
        stopTimer();
        timerMessage.hidden = false;
        timerMessage.textContent = "15 minutes are up. Stop or keep writing.";
      }
    }

    document.querySelector("#start-practice").addEventListener("click", () => {
      makePair();
      setView("prompts");
      document.querySelector("#prompt-stage-title").focus();
    });

    document.querySelector("#new-pair").addEventListener("click", () => {
      makePair();
      document.querySelector("#prompt-stage-title").focus();
    });

    document.querySelector("#choose-another").addEventListener("click", () => {
      stopTimer();
      setView("prompts");
      document.querySelector("#prompt-stage-title").focus();
    });

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) updateTimer();
    });
  </script>
</body>
</html>
