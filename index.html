<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:,">
  <title>Writing 3 · C2 Part 2 practice</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #202b34;
      --muted: #4c5b66;
      --paper: #ffffff;
      --wash: #f7f8f8;
      --line: #b9c4ca;
      --blue: #2b526d;
      --blue-dark: #1d3c52;
      --blue-pale: #eaf0f3;
      --rust: #a8442d;
      --rust-pale: #f7ece7;
      font-family: "Segoe UI", Arial, sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      margin: 0;
      background: var(--wash);
      color: var(--ink);
      font-size: 1rem;
      line-height: 1.55;
    }

    button, summary { font: inherit; }

    button {
      min-height: 48px;
      border: 2px solid transparent;
      border-radius: 4px;
      cursor: pointer;
    }

    button:focus-visible,
    summary:focus-visible {
      outline: 3px solid var(--rust);
      outline-offset: 3px;
    }

    button:disabled { cursor: not-allowed; opacity: 0.65; }

    .page {
      width: min(100% - 2rem, 880px);
      margin: 0 auto;
      padding: clamp(1rem, 4vw, 2.5rem) 0 2rem;
    }

    .masthead {
      padding-bottom: 1rem;
      border-bottom: 2px solid var(--blue);
    }

    .eyebrow {
      margin: 0 0 0.25rem;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 700;
    }

    h1, h2, h3, p { margin-top: 0; }

    h1 {
      margin-bottom: 0.25rem;
      font-size: clamp(1.7rem, 5vw, 2.4rem);
      line-height: 1.15;
    }

    .masthead p:last-child { margin-bottom: 0; }

    .stage {
      margin-top: 1rem;
      padding: clamp(1rem, 4vw, 1.5rem);
      border: 1px solid var(--line);
      background: var(--paper);
    }

    .stage h2 {
      margin-bottom: 0.75rem;
      font-size: clamp(1.3rem, 4vw, 1.7rem);
      line-height: 1.2;
    }

    .primary {
      display: inline-flex;
      width: 100%;
      align-items: center;
      justify-content: center;
      padding: 0.7rem 1rem;
      background: var(--blue-dark);
      color: var(--paper);
      font-size: 1.05rem;
      font-weight: 700;
      text-align: center;
    }

    .primary:hover { background: var(--blue); }

    .secondary {
      padding: 0.45rem 0.75rem;
      border-color: var(--blue);
      background: var(--paper);
      color: var(--blue-dark);
      font-weight: 600;
    }

    .secondary:hover { background: var(--blue-pale); }

    .prompt-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.75rem;
      margin: 1rem 0;
    }

    .prompt-choice {
      display: block;
      width: 100%;
      min-height: 100%;
      padding: 1rem;
      border-color: var(--line);
      background: var(--paper);
      color: var(--ink);
      text-align: left;
    }

    .prompt-choice:hover {
      border-color: var(--blue);
      background: var(--blue-pale);
    }

    .prompt-choice strong {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--blue-dark);
      font-size: 1rem;
      line-height: 1.35;
    }

    .prompt-choice span { display: block; }

    .writing-layout {
      display: grid;
      grid-template-columns: minmax(140px, 0.45fr) minmax(0, 1.55fr);
      gap: 1rem;
      align-items: start;
    }

    .timer-card {
      padding: 1rem;
      border: 1px solid var(--line);
      background: var(--paper);
    }

    .timer-card .eyebrow { color: var(--muted); }

    .timer-value {
      display: block;
      margin: 0.2rem 0 0;
      color: var(--blue-dark);
      font-size: clamp(2.2rem, 7vw, 3rem);
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      line-height: 1;
    }

    .timer-message {
      margin: 0.75rem 0 0;
      padding: 0.65rem;
      border-left: 4px solid var(--rust);
      background: var(--rust-pale);
    }

    .writing-prompt { margin-bottom: 1rem; }

    details {
      margin: 1rem 0;
      border: 1px solid var(--line);
      background: var(--paper);
    }

    summary {
      min-height: 48px;
      padding: 0.65rem 0.75rem;
      color: var(--blue-dark);
      cursor: pointer;
      font-weight: 700;
    }

    .language-content { padding: 0 0.75rem 0.75rem; }
    .language-content p { margin-bottom: 0.6rem; color: var(--muted); }
    .language-list { display: grid; gap: 0.55rem; margin: 0; padding: 0; list-style: none; }

    .language-list li {
      padding: 0.55rem 0.65rem;
      background: var(--blue-pale);
    }

    .language-list strong { color: var(--blue-dark); }
    .word-kind { color: var(--muted); font-size: 0.88rem; }

    .writing-actions { display: flex; flex-wrap: wrap; gap: 0.75rem; }
    .fine-print { margin: 0.75rem 0 0; color: var(--muted); font-size: 0.9rem; }
    [hidden] { display: none !important; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 640px) {
      .page { width: min(100% - 1.25rem, 880px); padding-top: 0.65rem; }
      .prompt-grid, .writing-layout { grid-template-columns: 1fr; }
      .timer-card {
        display: grid;
        grid-template-columns: auto 1fr;
        align-items: center;
        gap: 0.25rem 1rem;
      }
      .timer-card .eyebrow, .timer-value { margin: 0; }
      .timer-message { grid-column: 1 / -1; }
      .writing-actions > button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="masthead">
      <h1>Writing 3</h1>
      <p>C2 Proficiency Part 2-style practice · 15-minute start</p>
    </header>

    <section class="stage" id="welcome" aria-labelledby="welcome-title">
      <h2 class="sr-only" id="welcome-title">Start practice</h2>
      <button class="primary" id="start-practice" type="button">Start practice</button>
      <p class="fine-print">Write on paper or in your document. Nothing is saved here.</p>
    </section>

    <section class="stage" id="prompt-stage" aria-labelledby="prompt-stage-title" hidden>
      <h2 id="prompt-stage-title" tabindex="-1">Choose a task</h2>
      <div class="prompt-grid" id="prompt-options"></div>
      <button class="secondary" id="new-pair" type="button">Another pair</button>
    </section>

    <section class="stage" id="writing-stage" aria-labelledby="writing-title" hidden>
      <div class="writing-layout">
        <aside class="timer-card" aria-label="Writing timer">
          <p class="eyebrow">Time remaining</p>
          <time class="timer-value" id="timer-value" role="timer" aria-live="off">15:00</time>
          <p class="timer-message" id="timer-message" role="status" aria-live="polite" hidden></p>
        </aside>

        <div>
          <h2 id="writing-title" tabindex="-1"></h2>
          <p class="writing-prompt" id="writing-prompt"></p>

          <details id="language-details">
            <summary>Optional words and phrases</summary>
            <div class="language-content">
              <p>Use one or two if they fit.</p>
              <ul class="language-list" id="language-list"></ul>
            </div>
          </details>

          <div class="writing-actions">
            <button class="secondary" id="choose-another" type="button">Choose another task</button>
          </div>
        </div>
      </div>
    </section>

    <noscript><p class="stage timer-message">Turn on JavaScript to choose a task and run the timer.</p></noscript>
  </main>

  <script>
    "use strict";

    const prompts = [
      {
        id: "study-spaces",
        format: "Article",
        prompt: "The student magazine is preparing an issue on places to study between classes. As a student who uses these spaces, write an article for fellow students to help them choose where to work. Describe one place, explain what helps or hinders study there, and suggest one improvement.",
        language: [
          { term: "communal", kind: "adjective", meaning: "shared by a group" },
          { term: "amenity", kind: "noun", meaning: "a useful feature of a place" },
          { term: "conducive to", kind: "phrase", meaning: "helping something happen" },
          { term: "distraction", kind: "noun", meaning: "something that takes your attention away" },
          { term: "make better use of", kind: "phrase", meaning: "use more effectively" }
        ]
      },
      {
        id: "skills-outside-class",
        format: "Article",
        prompt: "A student magazine is collecting articles on skills learned outside class. As a student with experience of one such activity, write an article for fellow students about its value. Describe the activity, explain one skill it develops, and show how that skill could help after graduation.",
        language: [
          { term: "extracurricular", kind: "adjective", meaning: "outside formal lessons" },
          { term: "transferable skill", kind: "noun phrase", meaning: "a skill useful in different settings" },
          { term: "initiative", kind: "noun", meaning: "the ability to act without being told" },
          { term: "perseverance", kind: "noun", meaning: "continued effort despite difficulty" },
          { term: "apply", kind: "verb", meaning: "use in a particular situation" }
        ]
      },
      {
        id: "weekend-activity",
        format: "Article",
        prompt: "A local magazine is preparing a guide to low-cost weekend activities. As a student who knows the area, write an article for local readers recommending one activity. Explain why it is worth trying and suggest how more people could take part.",
        language: [
          { term: "affordable", kind: "adjective", meaning: "low enough in price for people to pay" },
          { term: "appeal", kind: "noun", meaning: "the quality that makes something attractive" },
          { term: "accessible", kind: "adjective", meaning: "easy for people to use or join" },
          { term: "low-cost", kind: "adjective", meaning: "needing little money" },
          { term: "broaden participation", kind: "phrase", meaning: "help more people take part" }
        ]
      },
      {
        id: "student-events",
        format: "Report",
        prompt: "The students' union is planning its programme for next term. As a course representative, write a report for union officers to help them choose events. Assess which current activities students value, identify one group whose needs are not met, and recommend an event.",
        language: [
          { term: "turnout", kind: "noun", meaning: "the number of people who attend an event" },
          { term: "participation", kind: "noun", meaning: "the act of taking part in an activity" },
          { term: "inclusive", kind: "adjective", meaning: "designed to involve different people" },
          { term: "cater for", kind: "phrase", meaning: "provide what a person or group needs" },
          { term: "appeal to", kind: "phrase", meaning: "be attractive or interesting to" }
        ]
      },
      {
        id: "cycle-parking",
        format: "Report",
        prompt: "The university board is reviewing cycle parking on campus. As a student who cycles to campus, write a report for board members to help them decide what to change. Assess current provision, explain who is affected by its limits, and recommend one improvement.",
        language: [
          { term: "provision", kind: "noun", meaning: "something supplied or made available" },
          { term: "secure", kind: "adjective", meaning: "safe from theft or harm" },
          { term: "sheltered", kind: "adjective", meaning: "protected from weather" },
          { term: "commuter", kind: "noun", meaning: "someone who travels regularly to work or study" },
          { term: "allocate funds", kind: "phrase", meaning: "set money aside for a purpose" }
        ]
      },
      {
        id: "welcome-activities",
        format: "Report",
        prompt: "The programme committee wants to improve welcome activities for new students. As a first-year mentor, write a report for committee members to guide next year's programme. Evaluate which activities help students settle in, identify a gap, and recommend two changes.",
        language: [
          { term: "orientation", kind: "noun", meaning: "an introduction to a new place or programme" },
          { term: "belonging", kind: "noun", meaning: "the feeling of being accepted in a group" },
          { term: "signpost", kind: "verb", meaning: "show someone where to find help or information" },
          { term: "transition", kind: "noun", meaning: "a change from one situation to another" },
          { term: "retain", kind: "verb", meaning: "continue to have or keep" }
        ]
      },
      {
        id: "film-setting",
        format: "Review",
        prompt: "An online magazine invites reviews of documentaries that change how viewers see everyday objects. As someone who watched one, write a review for readers choosing a documentary. Explain its subject, assess how well the film holds attention, and say who would enjoy it.",
        language: [
          { term: "setting", kind: "noun", meaning: "the place and time in which a story happens" },
          { term: "portrayal", kind: "noun", meaning: "the way a person or place is shown" },
          { term: "convincing", kind: "adjective", meaning: "believable" },
          { term: "nuanced", kind: "adjective", meaning: "showing careful differences or details" },
          { term: "resonate with", kind: "phrase", meaning: "create a feeling of connection with" }
        ]
      },
      {
        id: "arts-event",
        format: "Review",
        prompt: "A local arts magazine invites reviews of events that may interest students. As someone who attended an exhibition or performance, write a review for student readers to help them decide whether to go. Describe a memorable feature and assess the event.",
        language: [
          { term: "immersive", kind: "adjective", meaning: "making the audience feel involved" },
          { term: "pace", kind: "noun", meaning: "the speed or flow of an event" },
          { term: "compelling", kind: "adjective", meaning: "holding your attention" },
          { term: "interpretation", kind: "noun", meaning: "the way an artist presents an idea" },
          { term: "accessible to", kind: "phrase", meaning: "easy for someone to understand or experience" }
        ]
      },
      {
        id: "explainer-book",
        format: "Review",
        prompt: "A student magazine is reviewing non-fiction books that explain a subject to general readers. As a reader of one such book, write a review for fellow students choosing a book to read. Explain the subject, assess how clearly the author presents it, and say who would find it useful.",
        language: [
          { term: "non-specialist", kind: "noun", meaning: "someone without expert knowledge" },
          { term: "well-researched", kind: "adjective", meaning: "based on careful investigation" },
          { term: "engaging", kind: "adjective", meaning: "interesting and able to hold attention" },
          { term: "oversimplify", kind: "verb", meaning: "make something seem simpler than it is" },
          { term: "clarity", kind: "noun", meaning: "the quality of being easy to understand" }
        ]
      },
      {
        id: "cafe-food-waste",
        format: "Formal letter",
        prompt: "The local newspaper invites readers to suggest how cafés in town could reduce food waste. As a regular customer, write a formal letter to the editor for local readers. Describe one source of waste, propose a practical change, and explain its likely effect.",
        language: [
          { term: "surplus", kind: "noun", meaning: "more of something than is needed" },
          { term: "dispose of", kind: "phrase", meaning: "throw something away" },
          { term: "perishable", kind: "adjective", meaning: "likely to go bad quickly" },
          { term: "portion", kind: "noun", meaning: "an amount of food served to one person" },
          { term: "reduce waste", kind: "phrase", meaning: "use or throw away less" }
        ]
      },
      {
        id: "outdoor-space",
        format: "Formal letter",
        prompt: "A community centre is asking regular visitors how to improve its outdoor space. As a visitor, write a formal letter to the centre director recommending a change. Describe how the space is used now, suggest one improvement, and explain who would benefit.",
        language: [
          { term: "versatile", kind: "adjective", meaning: "useful for many different purposes" },
          { term: "communal", kind: "adjective", meaning: "shared by a group" },
          { term: "sheltered", kind: "adjective", meaning: "protected from weather" },
          { term: "maintenance", kind: "noun", meaning: "work needed to keep something in good condition" },
          { term: "accommodate", kind: "verb", meaning: "provide enough space for" }
        ]
      },
      {
        id: "arts-attendance",
        format: "Formal letter",
        prompt: "The local arts council wants to attract more students to its events. As a regular attendee, write a formal letter to council members suggesting how to do this. Identify one reason students may not attend, propose an initiative, and explain how it could reach them.",
        language: [
          { term: "attendance", kind: "noun", meaning: "the number of people who go to an event" },
          { term: "barrier", kind: "noun", meaning: "something that prevents people from taking part" },
          { term: "initiative", kind: "noun", meaning: "a planned action to improve a situation" },
          { term: "target audience", kind: "noun phrase", meaning: "the group an event or message is meant for" },
          { term: "widen the appeal", kind: "phrase", meaning: "make something attractive to more people" }
        ]
      }
    ];
    const welcome = document.querySelector("#welcome");
    const promptStage = document.querySelector("#prompt-stage");
    const writingStage = document.querySelector("#writing-stage");
    const promptOptions = document.querySelector("#prompt-options");
    const timerValue = document.querySelector("#timer-value");
    const timerMessage = document.querySelector("#timer-message");
    const languageDetails = document.querySelector("#language-details");
    const languageList = document.querySelector("#language-list");

    let currentPair = [];
    let lastPairIds = [];
    let timerDeadline = 0;
    let timerInterval = null;

    function shuffle(items) {
      const result = [...items];
      for (let index = result.length - 1; index > 0; index -= 1) {
        const other = Math.floor(Math.random() * (index + 1));
        [result[index], result[other]] = [result[other], result[index]];
      }
      return result;
    }

    function makePair() {
      const available = prompts.filter((item) => !lastPairIds.includes(item.id));
      const pool = available.length >= 2 ? available : prompts;
      const ordered = shuffle(pool);
      const first = ordered[0];
      const second = ordered.find((item) => item.format !== first.format);
      currentPair = [first, second];
      lastPairIds = currentPair.map((item) => item.id);
      renderPair();
    }

    function setView(view) {
      welcome.hidden = view !== "welcome";
      promptStage.hidden = view !== "prompts";
      writingStage.hidden = view !== "writing";
    }

    function renderPair() {
      promptOptions.replaceChildren();
      currentPair.forEach((item) => {
        const button = document.createElement("button");
        const title = document.createElement("strong");
        const text = document.createElement("span");
        button.type = "button";
        button.className = "prompt-choice";
        title.textContent = `${item.format} · 280–320 words`;
        text.textContent = item.prompt;
        button.append(title, text);
        button.addEventListener("click", () => choosePrompt(item));
        promptOptions.append(button);
      });
    }

    function renderLanguage(items) {
      languageList.replaceChildren();
      items.forEach((item) => {
        const row = document.createElement("li");
        const heading = document.createElement("strong");
        const kind = document.createElement("span");
        const meaning = document.createElement("span");
        heading.textContent = item.term;
        kind.className = "word-kind";
        kind.textContent = ` (${item.kind})`;
        meaning.textContent = ` — ${item.meaning}`;
        row.append(heading, kind, meaning);
        languageList.append(row);
      });
    }

    function choosePrompt(item) {
      stopTimer();
      document.querySelector("#writing-title").textContent = `${item.format} · 280–320 words`;
      document.querySelector("#writing-prompt").textContent = item.prompt;
      renderLanguage(item.language);
      languageDetails.open = false;
      timerMessage.hidden = true;
      timerMessage.textContent = "";
      timerValue.textContent = "15:00";
      setView("writing");
      document.querySelector("#writing-title").focus();
      startTimer();
    }

    function startTimer() {
      timerDeadline = Date.now() + 15 * 60 * 1000;
      updateTimer();
      timerInterval = window.setInterval(updateTimer, 1000);
    }

    function stopTimer() {
      if (timerInterval !== null) {
        window.clearInterval(timerInterval);
        timerInterval = null;
      }
      timerDeadline = 0;
    }

    function updateTimer() {
      if (timerDeadline === 0) return;
      const remaining = Math.max(0, Math.ceil((timerDeadline - Date.now()) / 1000));
      const minutes = Math.floor(remaining / 60);
      const seconds = remaining % 60;
      timerValue.textContent = `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;

      if (remaining === 0) {
        stopTimer();
        timerMessage.hidden = false;
        timerMessage.textContent = "15 minutes are up. Stop or keep writing.";
      }
    }

    document.querySelector("#start-practice").addEventListener("click", () => {
      makePair();
      setView("prompts");
      document.querySelector("#prompt-stage-title").focus();
    });

    document.querySelector("#new-pair").addEventListener("click", () => {
      makePair();
      document.querySelector("#prompt-stage-title").focus();
    });

    document.querySelector("#choose-another").addEventListener("click", () => {
      stopTimer();
      setView("prompts");
      document.querySelector("#prompt-stage-title").focus();
    });

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) updateTimer();
    });
  </script>
</body>
</html>
